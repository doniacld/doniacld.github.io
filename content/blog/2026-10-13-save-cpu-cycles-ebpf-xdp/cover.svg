<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="630" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="118" text-anchor="middle" font-size="48" font-weight="700" fill="#0f172a">Is XDP more performant than TC?</text>

  <!-- Receive path diagram -->
  <g text-anchor="middle">
    <polygon points="110,320 250,320 230,400 90,400" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="166" y="366" font-size="22" font-weight="600" fill="#0f172a">Packet</text>

    <rect x="270" y="320" width="150" height="80" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="345" y="366" font-size="22" font-weight="600" fill="#0f172a">NIC</text>

    <rect x="460" y="320" width="150" height="80" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="535" y="366" font-size="22" font-weight="600" fill="#0f172a">Driver</text>

    <rect x="650" y="320" width="220" height="80" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="760" y="356" font-size="21" font-weight="600" fill="#0f172a">Network stack</text>
    <text x="760" y="382" font-size="16" font-weight="500" fill="#b91c1c">sk_buff is built</text>

    <rect x="900" y="320" width="170" height="80" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <text x="985" y="366" font-size="22" font-weight="600" fill="#0f172a">TC ingress</text>
  </g>

  <g stroke="#334155" stroke-width="3" marker-end="url(#a)" fill="none">
    <line x1="244" y1="360" x2="266" y2="360"/>
    <line x1="424" y1="360" x2="456" y2="360"/>
    <line x1="614" y1="360" x2="646" y2="360"/>
    <line x1="874" y1="360" x2="896" y2="360"/>
  </g>

  <!-- XDP attaches before the sk_buff -->
  <g text-anchor="middle">
    <rect x="290" y="420" width="110" height="42" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="345" y="447" font-size="18" font-weight="700" fill="#15803d">XDP</text>
    <rect x="480" y="420" width="110" height="42" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="535" y="447" font-size="18" font-weight="700" fill="#15803d">XDP</text>
    <text x="440" y="505" font-size="23" font-weight="600" fill="#15803d">XDP drops here, before the sk_buff</text>
  </g>
  <g stroke="#16a34a" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="378" y1="487" x2="352" y2="465"/>
    <line x1="502" y1="487" x2="528" y2="465"/>
  </g>
</svg>
