<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 130" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="950" height="130" fill="#ffffff"/>

  <g text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">
    <rect x="10" y="26" width="200" height="78" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="110" y="59">Peer transmits</text>
    <text x="110" y="81" font-size="15" fill="#b91c1c">sk_buff is built</text>

    <rect x="250" y="26" width="250" height="78" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="375" y="59">veth receive converts</text>
    <text x="375" y="81" font-size="15" fill="#1e40af">skb to xdp_buff</text>

    <rect x="540" y="26" width="180" height="78" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="630" y="59">XDP</text>
    <text x="630" y="81" font-size="15" fill="#15803d">XDP_DROP</text>

    <rect x="760" y="26" width="170" height="78" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <text x="845" y="70">sk_buff freed</text>
  </g>

  <g stroke="#334155" stroke-width="2.5" marker-end="url(#arrV)" fill="none">
    <line x1="212" y1="65" x2="246" y2="65"/>
    <line x1="502" y1="65" x2="536" y2="65"/>
    <line x1="722" y1="65" x2="756" y2="65"/>
  </g>
</svg>
