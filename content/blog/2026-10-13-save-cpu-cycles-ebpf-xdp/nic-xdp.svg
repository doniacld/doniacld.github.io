<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 130" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="130" fill="#ffffff"/>

  <g text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">
    <rect x="10" y="26" width="230" height="78" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="125" y="59">NIC DMAs raw frame</text>
    <text x="125" y="81" font-size="15" fill="#1e40af">into an RX buffer</text>

    <rect x="280" y="26" width="210" height="78" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="385" y="59">XDP: XDP_DROP</text>
    <text x="385" y="81" font-size="15" fill="#15803d">on the raw frame</text>

    <rect x="530" y="26" width="170" height="78" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <text x="615" y="70">buffer recycled</text>

    <rect x="740" y="26" width="210" height="78" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="845" y="59" fill="#64748b">sk_buff</text>
    <text x="845" y="81" font-size="15" fill="#64748b">never built</text>
  </g>

  <g stroke="#334155" stroke-width="2.5" marker-end="url(#arrN)" fill="none">
    <line x1="242" y1="65" x2="276" y2="65"/>
    <line x1="492" y1="65" x2="526" y2="65"/>
  </g>
</svg>
